name: Badges

on:
  push:
    branches: [main]
  release:
    types: [published, edited, deleted]
  schedule:
    # Weekly, so the last-commit colour ages like it does on shields.io.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install badge tools
        working-directory: .github/scripts
        run: npm install --no-save --no-package-lock badge-maker@6 simple-icons@16

      - name: Collect badge values
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo none)
          license=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.license.spdx_id // "none"')
          dotnet=$(sed -n 's:.*<TargetFrameworkVersion>v\(.*\)</TargetFrameworkVersion>.*:\1:p' dlss-updater.csproj | head -n 1)
          {
            echo "RELEASE=$release"
            echo "LAST_COMMIT=$(git log -1 --format=%cI)"
            echo "LICENSE=$license"
            echo "DOTNET=$dotnet"
          } >> "$GITHUB_ENV"

      - name: Build badges
        run: node .github/scripts/badges.mjs "$RUNNER_TEMP/badges"

      - name: Publish to the badges branch
        working-directory: ${{ runner.temp }}/badges
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: update badges"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" badges
