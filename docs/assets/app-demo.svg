<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 688" width="736" height="688" role="img" aria-labelledby="t">
  <title id="t">DLSS Updater scanning Twinmotion 2026.1, updating its DLSS file and showing it as just added to Your folders</title>
  <style>
    text { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #E8EDE8; }
    .title { font-size: 12px; fill: #1b1b1b; }
    .h { font-size: 14.5px; font-weight: 600; }
    .dim { fill: #697469; }
    .muted { fill: #A4AEA2; }
    .small { font-size: 12px; }
    .ok { fill: #76B900; }
    .warn { fill: #E6B84A; }
    .btn { fill: #2A302A; stroke: #465046; }
    .btn-off { fill: #1E231E; stroke: #2A302A; }
    .panel { fill: #1C211C; stroke: #2A302A; }
    .rule { stroke: #2A302A; }
    .x { stroke: #A4AEA2; stroke-width: 1.3; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }

    .anim { animation-duration: 16s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .typed { animation-name: type; }
    .focus { animation-name: focus; }
    .scanning { animation-name: scanning; }
    .found { animation-name: found; }
    .scanned { animation-name: scanned; }
    .ready { animation-name: ready; }
    .updating { animation-name: updating; }
    .done { animation-name: done; }
    .before { animation-name: before; }
    .bar { animation-name: bar; }
    .press { animation-name: press; transform-origin: 652px 653.5px; transform-box: view-box; }
    .notice { animation-name: notice; }
    .cursor { animation-name: cursor; animation-timing-function: ease-in-out; }

    @keyframes type { 0%, 10% { width: 0; } 24%, 94% { width: 230px; } 95%, 100% { width: 0; } }
    @keyframes focus { 0%, 8.9% { opacity: 0; } 9%, 26.9% { opacity: 1; } 27%, 100% { opacity: 0; } }
    @keyframes scanning { 0%, 24.9% { opacity: 0; } 25%, 28.9% { opacity: 1; } 29%, 100% { opacity: 0; } }
    @keyframes found { 0%, 28.9% { opacity: 0; } 29%, 39.9% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes scanned { 0%, 28.9% { opacity: 0; } 29%, 57.9% { opacity: 1; } 58%, 100% { opacity: 0; } }
    @keyframes ready { 0%, 24.9% { opacity: 0; } 25%, 94% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes updating { 0%, 39.9% { opacity: 0; } 40%, 57.9% { opacity: 1; } 58%, 100% { opacity: 0; } }
    @keyframes done { 0%, 57.9% { opacity: 0; } 58%, 94% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes before { 0%, 57.9% { opacity: 1; } 58%, 94% { opacity: 0; } 95%, 100% { opacity: 1; } }
    @keyframes bar { 0%, 40% { width: 0; opacity: 1; } 57% { width: 676px; opacity: 1; } 59%, 100% { width: 676px; opacity: 0; } }
    @keyframes press { 0%, 39% { transform: scale(1); } 39.6% { transform: scale(0.96); } 40.3%, 100% { transform: scale(1); } }
    @keyframes notice { 0%, 59.5% { opacity: 0; } 61.5%, 94% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes cursor {
      0%, 2% { transform: translate(430px, 416px); opacity: 0; }
      4% { transform: translate(430px, 416px); opacity: 1; }
      8%, 27% { transform: translate(300px, 183px); opacity: 1; }
      36%, 58% { transform: translate(646px, 637px); opacity: 1; }
      60%, 100% { transform: translate(646px, 637px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none; }
    }
  </style>

  <defs>
    <clipPath id="window"><rect width="736" height="688" rx="8"/></clipPath>
    <clipPath id="typing"><rect class="anim typed" x="58" y="180" width="230" height="34"/></clipPath>
  </defs>

  <g clip-path="url(#window)">
    <!-- Window chrome -->
    <rect width="736" height="688" fill="#171A17"/>
    <rect width="736" height="31" fill="#F3F3F3"/>
    <rect x="9" y="8" width="16" height="16" rx="3" fill="#76B900"/>
    <circle cx="17" cy="16" r="4.5" fill="none" stroke="#fff" stroke-width="1.6"/>
    <text class="title" x="31" y="20">DLSS Updater</text>
    <path d="M614 16h10" stroke="#1b1b1b"/>
    <rect x="661.5" y="10.5" width="9" height="9" fill="none" stroke="#b8b8b8"/>
    <path d="M707 11l10 10M717 11l-10 10" stroke="#1b1b1b"/>

    <!-- Menu bar -->
    <rect y="31" width="736" height="30" fill="#1C211C"/>
    <path d="M0 60.5h736" class="rule"/>
    <text x="18" y="51" style="font-size:13px">File</text>
    <text x="57" y="51" style="font-size:13px">Language</text>
    <text x="133" y="51" style="font-size:13px">Help</text>

    <!-- Everything under the menu bar sits 14px higher than the old picker layout -->
    <g transform="translate(0 -14)">
    <!-- Folder to scan, with the saved folders list underneath (stays collapsed) -->
    <rect class="panel" x="29.5" y="107.5" width="677" height="172" rx="6"/>
    <text class="h" x="48" y="139">Folder to scan</text>
    <path d="M30 157.5h676" class="rule"/>
    <rect x="48.5" y="178.5" width="543" height="36" rx="4" fill="#171A17" stroke="#394139"/>
    <rect class="anim focus" x="48.5" y="178.5" width="543" height="36" rx="4" fill="none" stroke="#76B900" opacity="0"/>
    <text x="60" y="202" clip-path="url(#typing)">C:\Program Files\Twinmotion 2026.1</text>
    <rect x="600.5" y="178.5" width="87" height="36" rx="4" class="btn"/>
    <text class="c" x="644" y="202">Browse</text>

    <path d="M30 235.5h676" class="rule"/>
    <text class="muted anim before" x="48" y="262" style="font-size:13px;font-weight:600" opacity="0">Your folders (3)</text>
    <text class="muted anim done" x="48" y="262" style="font-size:13px;font-weight:600">Your folders (4)</text>
    <path d="M676.5 254.5h10l-5 6z" fill="#A4AEA2"/>

    <!-- Header note: appears once Update adds Twinmotion 2026.1 to the list -->
    <text class="anim notice e" x="664" y="262" opacity="0" style="font-size:13px;fill:#86CC0A">1 just added</text>

    <g>
      <!-- Scan results -->
      <rect x="29.5" y="296.5" width="677" height="103" rx="6" class="panel"/>
      <text class="h dim" x="48" y="328">Scan results</text>
      <text class="h anim ready" x="48" y="328">Scan results</text>
      <path d="M30 346.5h676" class="rule"/>
      <rect class="anim bar" x="30" y="345" width="0" height="3" fill="#76B900"/>
      <text class="muted anim scanning" x="48" y="378" opacity="0">Searching...</text>
      <text class="muted anim found" x="48" y="378" opacity="0">Found 1 DLSS file<tspan class="warn"> · 1 update available</tspan></text>
      <text class="muted anim updating" x="48" y="378" opacity="0">Updating nvngx_dlss.dll…</text>
      <text class="muted anim done" x="48" y="378">Found 1 DLSS file<tspan class="ok"> · all up to date</tspan></text>
      <rect x="576.5" y="355.5" width="111" height="36" rx="4" class="btn-off"/>
      <text class="c dim" x="632" y="379">Show details</text>
      <g class="anim ready">
        <rect x="576.5" y="355.5" width="111" height="36" rx="4" class="btn"/>
        <text class="c" x="632" y="379">Show details</text>
      </g>

      <!-- Backup -->
      <rect x="29.5" y="416.5" width="677" height="156" rx="6" class="panel"/>
      <text class="h dim" x="48" y="448">Backup</text>
      <text class="h anim ready" x="48" y="448">Backup</text>
      <path d="M30 467.5h676" class="rule"/>
      <text class="muted anim scanned" x="48" y="499" opacity="0">No backups detected</text>
      <text class="anim done" x="48" y="499" style="fill:#86CC0A">✓  Backup found (310.2.1)</text>
      <rect x="415.5" y="475.5" width="134" height="36" rx="4" class="btn-off"/>
      <text class="c dim" x="482" y="499">Restore backups</text>
      <rect x="558.5" y="475.5" width="129" height="36" rx="4" class="btn-off"/>
      <text class="c dim" x="623" y="499">Delete backups</text>
      <g class="anim done">
        <rect x="415.5" y="475.5" width="134" height="36" rx="4" class="btn"/>
        <text class="c" x="482" y="499">Restore backups</text>
        <rect x="558.5" y="475.5" width="129" height="36" rx="4" class="btn"/>
        <text class="c" x="623" y="499">Delete backups</text>
      </g>
      <path d="M30 520.5h676" class="rule"/>
      <text class="muted" x="48" y="552">Overwrite backup when updating</text>
      <text class="muted" x="622" y="552">On</text>
      <rect x="648" y="536" width="40" height="20" rx="10" fill="#609600"/>
      <circle cx="678" cy="546" r="7" fill="#E8EDE8"/>

      <!-- Update: enabled once the scan finds a newer version -->
      <rect x="597" y="635" width="110" height="37" rx="4" fill="#2C3A1C"/>
      <text class="c" x="652" y="659" style="fill:#5B6B45">Update</text>
      <g class="anim press">
        <g class="anim scanned" opacity="0">
          <rect x="597" y="635" width="110" height="37" rx="4" fill="#76B900"/>
          <text class="c anim found" x="652" y="659" opacity="0" style="fill:#11170D;font-weight:600">Update (1)</text>
          <text class="c anim updating" x="652" y="659" opacity="0" style="fill:#11170D;font-weight:600">Updating...</text>
        </g>
      </g>
    </g>

    </g>

    <!-- Pointer -->
    <g class="anim cursor" opacity="0">
      <path d="M0 0v17l4.5-4 3 7 3-1.3-3-6.8h6z" fill="#fff" stroke="#000" stroke-width="1" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
